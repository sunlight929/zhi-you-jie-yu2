[theme]
base = "dark"
primaryColor = "#5BC8FF"
backgroundColor = "#0A0B1E"
secondaryBackgroundColor = "#16182F"
textColor = "#E8F0FF"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false

[client]
# viewer 模式: 完全隐藏 Fork on GitHub 按钮 + Manage app + 开发者工具栏
# (比 minimal 更严格,适合答辩展示)
toolbarMode = "viewer"
showErrorDetails = false
