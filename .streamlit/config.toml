[theme]
base = "dark"
primaryColor = "#5BC8FF"
backgroundColor = "#0A0B1E"
secondaryBackgroundColor = "#16182F"
textColor = "#E8F0FF"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false

[client]
# 隐藏右上角 Streamlit 自带的 Deploy 按钮 + 三点菜单
toolbarMode = "minimal"
showErrorDetails = false
